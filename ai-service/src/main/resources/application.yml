server:
  port: 8083

spring:
  application:
    name: ai-service
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:infra_mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:omnidoc}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 300000
      connection-timeout: 10000

  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: nacos:8848
        namespace: public
        timeout: 30000
      client:
        namespace: public
        timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:infra_redis}
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 1
      timeout: 10000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        model: qwen3.7-max-2026-05-20
      embedding:
        model: text-embedding-v1
        api-key: ${DASHSCOPE_API_KEY}
      rerank:
        enabled: true
        model: qwen3-rerank
        timeout-ms: 10000
        api-key: ${DASHSCOPE_API_KEY}
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}

  rabbitmq:
    host: ${RABBITMQ_HOST:infra_rabbitmq}
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

# AI配置
ai:
  memory:
    enabled: ${AI_MEMORY_ENABLED:true}
    schema:
      auto-migration:
        enabled: ${AI_MEMORY_SCHEMA_AUTO_MIGRATION_ENABLED:false}
    legacy:
      import:
        enabled: ${AI_MEMORY_LEGACY_IMPORT_ENABLED:false}
    runtime-state:
      current-document-id:
        ttl: 30m
        max-bytes: 512
      selected-text:
        ttl: 10m
        max-bytes: 16384
      page-context:
        ttl: 10m
        max-bytes: 4096
      pending-approval:
        ttl: 5m
        max-bytes: 1024
      current-tool-state:
        ttl: 1h
        max-bytes: 2048
      legacy-compatibility-ttl: 10m
  conversation:
    max-messages: 100
    expiry-hours: 24
  agent:
    reflection:
      enabled: true
  vector:
    mode: ${VECTOR_STORE_MODE:baseline}
    dimension: 1536
    embedding:
      model: ${VECTOR_EMBEDDING_MODEL:text-embedding-v1}
      schema-version: ${VECTOR_SCHEMA_VERSION:1}
    hnsw:
      m: 16
      ef-construction: 200
      ef: 128
      max-items: 200000
    qdrant:
      host: ${QDRANT_HOST:qdrant}
      grpc-port: ${QDRANT_GRPC_PORT:6334}
      api-key: ${QDRANT_API_KEY:}
      collection-alias: ${QDRANT_COLLECTION_ALIAS:omnidoc_chunks_active}
      connect-timeout-ms: 3000
      request-timeout-ms: 5000
      batch-size: 100
    shadow:
      sample-rate: 1.0
      timeout-ms: 3000
    migration:
      batch-size: 100
      checkpoint-path: ${VECTOR_MIGRATION_CHECKPOINT_PATH:var/qdrant-migration/checkpoint.json}
  aiops:
    metrics:
      retention-ms: 900000
      persist-interval-ms: 60000
    detection:
      interval-ms: 60000
      window-ms: 300000
      latency-p95-threshold-ms: 5000
      error-rate-threshold: 0.1
      min-request-count: 10
    alert:
      cooldown-ms: 300000
  # 多模型配置
  models:
    openai:
      qwen3.7-max-2026-05-20:
        api-key: ${OPENAI_API_KEY}
        base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        enabled: true
      glm-5:
        api-key: ${OPENAI_API_KEY}
        base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        enabled: true
      kimi-k2.5:
        api-key: ${OPENAI_API_KEY}
        base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        enabled: true
      MiniMax-M2.5:
        api-key: ${OPENAI_API_KEY}
        base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        enabled: true

# MinIO配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://infra_minio:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: omnidoc
  # bucket=permissionGroup1,permissionGroup2; another-bucket=groupA
  # JWT 中的 role 会作为默认权限组；可额外通过 permissionGroups/groups claim 扩展。
  bucket-permissions: "documents=admin,user;omnidoc=admin,user"
  bucket-permission-default-allow: false
  url:
    expiry: 3600
  recycle:
    expiry-days: 7
  delete:
    confirmation-timeout: 300

# 文档服务配置
document:
  service:
    url: http://document:8084

# 日志配置
logging:
  level:
    com.javaee.aiservice: debug
    io.modelcontextprotocol: off
    org.springframework.ai: info
    org.springframework.security: info

agent:
  mcp:
    enabled: false
    fail-fast: false
    servers:
      web-search:
        enabled: true
        transport: streamable-http
        base-url: ${TAVILY_MCP_BASE_URL:https://mcp.tavily.com}
        endpoint: ${TAVILY_MCP_ENDPOINT:/mcp/}
        api-key: ${TAVILY_API_KEY:}
        namespace: mcp.web-search
        connect-timeout: 5s
        request-timeout: 20s
        max-result-chars: 30000
        allowed-tools:
          - tavily-search

# SpringDoc配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
