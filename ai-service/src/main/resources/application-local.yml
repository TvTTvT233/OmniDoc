server:
  port: 8083

spring:
  application:
    name: ai-service
  main:
    allow-bean-definition-overriding: true

  autoconfigure:
    exclude:
      - com.alibaba.cloud.nacos.discovery.NacosDiscoveryAutoConfiguration
      - com.alibaba.cloud.nacos.registry.NacosServiceRegistryAutoConfiguration
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

  datasource:
    url: jdbc:mysql://${MYSQL_LOCAL_HOST:localhost}:${MYSQL_LOCAL_PORT:3306}/${MYSQL_DATABASE:omnidoc}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_LOCAL_USERNAME:root}
    password: ${MYSQL_LOCAL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 30000
      max-lifetime: 300000
      connection-timeout: 10000

  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        enabled: false
      registry:
        enabled: false

  data:
    redis:
      host: ${REDIS_LOCAL_HOST:localhost}
      port: 6379
      password: ${REDIS_LOCAL_PASSWORD:}
      database: 1
      timeout: 10000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        model: qwen3.7-max-2026-05-20
      embedding:
        model: text-embedding-v1
        api-key: ${DASHSCOPE_API_KEY}
      rerank:
        enabled: true
        model: qwen3-rerank
        timeout-ms: 10000
        api-key: ${DASHSCOPE_API_KEY}
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

# AI配置
ai:
  memory:
    enabled: ${AI_MEMORY_ENABLED:true}
    api:
      # Configure one shared value in production so signed list cursors survive restarts/replicas.
      cursor-signing-key: ${AI_MEMORY_CURSOR_SIGNING_KEY:${OMNIDOC_JWT_SECRET:}}
    context:
      default-window-tokens: ${AI_MEMORY_CONTEXT_WINDOW_TOKENS:32768}
      reserved-output-tokens: ${AI_MEMORY_CONTEXT_RESERVED_OUTPUT_TOKENS:4096}
      safety-reserve-percent: ${AI_MEMORY_CONTEXT_SAFETY_PERCENT:10}
      history-page-size: ${AI_MEMORY_CONTEXT_HISTORY_PAGE_SIZE:200}
      block-overhead-tokens: ${AI_MEMORY_CONTEXT_BLOCK_OVERHEAD_TOKENS:8}
    summary:
      enabled: ${AI_MEMORY_SUMMARY_ENABLED:true}
      trigger-input-tokens: ${AI_MEMORY_SUMMARY_TRIGGER_TOKENS:12000}
      retain-recent-tokens: ${AI_MEMORY_SUMMARY_RETAIN_RECENT_TOKENS:4000}
      max-source-tokens: ${AI_MEMORY_SUMMARY_MAX_SOURCE_TOKENS:16000}
      max-attempts: ${AI_MEMORY_SUMMARY_MAX_ATTEMPTS:2}
      timeout: ${AI_MEMORY_SUMMARY_TIMEOUT:20s}
      model: ${AI_MEMORY_SUMMARY_MODEL:}
    schema:
      auto-migration:
        enabled: ${AI_MEMORY_SCHEMA_AUTO_MIGRATION_ENABLED:false}
    legacy:
      import:
        enabled: ${AI_MEMORY_LEGACY_IMPORT_ENABLED:false}
    runtime-state:
      current-document-id:
        ttl: 30m
        max-bytes: 512
      selected-text:
        ttl: 10m
        max-bytes: 16384
      page-context:
        ttl: 10m
        max-bytes: 4096
      pending-approval:
        ttl: 5m
        max-bytes: 1024
      current-tool-state:
        ttl: 1h
        max-bytes: 2048
      legacy-compatibility-ttl: 10m
  conversation:
    max-messages: 100
    expiry-hours: 24
  agent:
    reflection:
      enabled: true
  vector:
    mode: ${VECTOR_STORE_MODE:baseline}
    dimension: 1536
    embedding:
      model: ${VECTOR_EMBEDDING_MODEL:text-embedding-v1}
      schema-version: ${VECTOR_SCHEMA_VERSION:1}
    hnsw:
      m: 16
      ef-construction: 200
      ef: 128
      max-items: 200000
    qdrant:
      host: ${QDRANT_HOST:localhost}
      grpc-port: ${QDRANT_GRPC_PORT:6334}
      api-key: ${QDRANT_API_KEY:}
      collection-alias: ${QDRANT_COLLECTION_ALIAS:omnidoc_chunks_active}
      connect-timeout-ms: 3000
      request-timeout-ms: 5000
      batch-size: 100
    shadow:
      sample-rate: 1.0
      timeout-ms: 3000
    migration:
      batch-size: 100
      checkpoint-path: ${VECTOR_MIGRATION_CHECKPOINT_PATH:var/qdrant-migration/checkpoint.json}
  aiops:
    metrics:
      retention-ms: 900000
      persist-interval-ms: 60000
    detection:
      interval-ms: 60000
      window-ms: 300000
      latency-p95-threshold-ms: 5000
      error-rate-threshold: 0.1
      min-request-count: 10
    alert:
      cooldown-ms: 300000
  # 多模型配置
  models:
    openai:
      qwen3.7-max-2026-05-20:
        api-key: ${OPENAI_API_KEY}
        base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        enabled: true
      glm-5:
        api-key: ${OPENAI_API_KEY}
        base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        enabled: true
      kimi-k2.5:
        api-key: ${OPENAI_API_KEY}
        base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        enabled: true
      MiniMax-M2.5:
        api-key: ${OPENAI_API_KEY}
        base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        enabled: true

# MinIO配置
minio:
  endpoint: ${MINIO_LOCAL_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: omnidoc
  bucket-permissions: "documents=admin,user;omnidoc=admin,user"
  bucket-permission-default-allow: false
  url:
    expiry: 3600
  recycle:
    expiry-days: 7
  delete:
    confirmation-timeout: 300

# 文档服务配置
document:
  service:
    url: http://localhost:8084

# 日志配置
logging:
  level:
    com.javaee.aiservice: debug
    org.springframework.ai: info
    org.springframework.security: info

# SpringDoc配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
