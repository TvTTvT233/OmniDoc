spring:
  autoconfigure:
    exclude:
      - com.alibaba.cloud.nacos.discovery.NacosDiscoveryAutoConfiguration
      - com.alibaba.cloud.nacos.registry.NacosServiceRegistryAutoConfiguration

  datasource:
    url: jdbc:mysql://${MYSQL_LOCAL_HOST:localhost}:${MYSQL_LOCAL_PORT:3306}/${MYSQL_DATABASE:omnidoc}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_LOCAL_USERNAME:root}
    password: ${MYSQL_LOCAL_PASSWORD:}

  cloud:
    nacos:
      discovery:
        enabled: false
      registry:
        enabled: false

  data:
    redis:
      host: ${REDIS_LOCAL_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_LOCAL_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

minio:
  endpoint: ${MINIO_LOCAL_ENDPOINT:http://localhost:9000}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  exception-conversion-word: "%nopex"
  level:
    root: info
    com.javaee.fileservice: info
    org.apache.ibatis: warn
    com.baomidou.mybatisplus: warn
    org.mybatis: warn
    org.springframework.jdbc: warn
